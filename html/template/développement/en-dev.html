<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Site en développement</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0f19;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 700px;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 25px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(40px, 7vw, 72px);
            margin-bottom: 20px;
            font-weight: 700;
        }

        h1 span {
            color: #4f8cff;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            color: #aeb6c7;
            margin-bottom: 35px;
        }

        .warning {
            display: inline-block;
            padding: 14px 24px;
            border: 1px solid #ff4d4d;
            border-radius: 10px;
            color: #ff5c5c;
            background: rgba(255, 77, 77, 0.08);
            font-size: 15px;
        }

        .loader {
            width: 50px;
            height: 50px;
            margin: 35px auto 0;
            border: 4px solid #252d3d;
            border-top-color: #4f8cff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #687286;
            font-size: 13px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            p {
                font-size: 17px;
            }

            .warning {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icon">🚧</div>

        <h1>Site <span>en développement</span></h1>

        <p>
            Nous travaillons actuellement sur ce site afin de vous proposer
            une expérience complète et optimisée.
        </p>

        <div class="warning">
            ⚠️ Cette page est actuellement en cours de développement.
        </div>

        <div class="loader"></div>

    </main>

    <footer>
        © 2026 — Tous droits réservés
    </footer>

</body>
</html>
